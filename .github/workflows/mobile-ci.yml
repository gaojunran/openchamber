name: Mobile Smoke Build

# TEMPORARY verify-branch rewrite: this run exists to compile the share-sheet intake on a
# GitHub-hosted macOS runner, because the fork has no Blacksmith runners. Revert to the
# upstream version before opening the pull request.

on:
  workflow_dispatch:

concurrency:
  group: mobile-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  share-extension:
    name: Compile the OpenChamberShare target
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile the share extension without pods or signing
        working-directory: packages/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -target OpenChamberShare \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -150

  full-app:
    name: Build the app and assert the extension is embedded
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Build the iOS simulator app
        run: bun run mobile:build:ios:simulator

      - name: Assert the extension is embedded with its activation rule
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Debug-iphonesimulator/App.app' | head -1)
          test -n "$APP"
          echo "app: $APP"
          APPEX="$APP/PlugIns/OpenChamberShare.appex"
          test -d "$APPEX"
          echo "--- extension Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule' "$APPEX/Info.plist"
          echo "--- embedded extensions"
          ls "$APP/PlugIns"
