name: Mobile Smoke Build

# TEMPORARY verify-branch rewrite: this run exists to compile the share-sheet intake on a
# GitHub-hosted macOS runner, because the fork has no Blacksmith runners. Revert to the
# upstream version before opening the pull request.

on:
  workflow_dispatch:

concurrency:
  group: mobile-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  share-extension:
    name: Compile the OpenChamberShare target
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile the share extension without pods or signing
        working-directory: packages/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -target OpenChamberShare \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tail -150

  native-tests:
    name: Run the inbox and staging tests on a simulator
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, subprocess, sys

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          def version(runtime):
              found = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(found.group(1)), int(found.group(2))) if found else (0, 0)
          for runtime in sorted(data["devices"], key=version, reverse=True):
              for device in data["devices"][runtime]:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(f"udid={device['udid']}")
                      print(f"picked {device['name']} on {runtime}", file=sys.stderr)
                      raise SystemExit(0)
          raise SystemExit("no available iPhone simulator")
          PY

      - name: Run the tests
        working-directory: packages/mobile/ios/App
        run: |
          set -o pipefail
          xcodebuild test \
            -project App.xcodeproj \
            -scheme OpenChamberShareTests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -250

  full-app:
    name: Build the app and assert the extension is embedded
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Build the iOS simulator app
        run: bun run mobile:build:ios:simulator

      - name: Assert the extension is embedded with its activation rule
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*Debug-iphonesimulator/App.app' | head -1)
          test -n "$APP"
          echo "app: $APP"
          APPEX="$APP/PlugIns/OpenChamberShare.appex"
          test -d "$APPEX"
          echo "--- extension Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule' "$APPEX/Info.plist"
          echo "--- embedded extensions"
          ls "$APP/PlugIns"

  share-sheet-e2e:
    name: Share a photo through the real share sheet
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Install opencode, which the server needs to serve
        run: |
          npm install -g "@opencode/cli@$(node -p "require('./packages/electron/package.json').opencodeCli.version")"
          opencode --version

      - name: Build the app for the simulator, keeping the simulator Podfile
        env:
          IOS_SIM_BUILD_KEEP_PODS: '1'
        run: bun run mobile:build:ios:simulator

      - name: Start a server for the app to connect to
        run: |
          set -euo pipefail
          node packages/web/bin/cli.js serve --foreground --port 4123 --host 127.0.0.1 \
            > "$RUNNER_TEMP/openchamber-server.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4123/health; then
              echo "server answered after $((attempt * 2))s"
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/openchamber-server.log"
          exit 1

      - name: Pick a simulator and seed a photo
        id: sim
        run: |
          set -euo pipefail
          # A step cannot read its own outputs, so the UDID travels in a variable here
          # and as the step output only for the later steps.
          UDID=$(python3 - <<'PY'
          import json, re, subprocess, sys

          # The runner can carry runtimes newer than the selected Xcode's SDK, so prefer the
          # newest iPhone runtime the SDK actually supports.
          sdk = subprocess.check_output(["xcodebuild", "-version", "-sdk", "iphonesimulator"], text=True)
          found = re.search(r"iOS (\d+)\.(\d+)", sdk)
          sdk_major = int(found.group(1)) if found else 999
          print(sdk.strip().splitlines()[-1], file=sys.stderr)

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          def version(runtime):
              found = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(found.group(1)), int(found.group(2))) if found else (0, 0)

          candidates = []
          for runtime, devices in data["devices"].items():
              if not version(runtime)[0]:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version(runtime), device["name"], device["udid"], runtime))
          if not candidates:
              raise SystemExit("no available iPhone simulator")
          pool = [entry for entry in candidates if entry[0][0] <= sdk_major] or candidates
          pool.sort(key=lambda entry: (entry[0], entry[1]), reverse=True)
          version_picked, name, udid, runtime = pool[0]
          print(f"picked {name} on {runtime}", file=sys.stderr)
          print(udid)
          PY
          )
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          python3 -c "import base64;open('share-e2e.png','wb').write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='))"
          xcrun simctl addmedia "$UDID" share-e2e.png
          echo "seeded a photo into $UDID"

      - name: Run the share-sheet test
        working-directory: packages/mobile
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace ios/App/App.xcworkspace \
            -scheme OpenChamberE2E \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/e2e.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Export the screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/e2e.xcresult" \
            --output-path "$RUNNER_TEMP/e2e-attachments" || true
          ls -la "$RUNNER_TEMP/e2e-attachments" || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-sheet-e2e
          path: |
            ${{ runner.temp }}/e2e-attachments
            ${{ runner.temp }}/e2e.log
            ${{ runner.temp }}/openchamber-server.log
          if-no-files-found: warn
