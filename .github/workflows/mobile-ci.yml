name: Mobile Smoke Build

on:
  workflow_dispatch:

jobs:
  ios-build:
    name: Build the app for the simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Build for the simulator
        run: bun run mobile:build:ios:simulator

      - name: Assert the quick actions reached the bundle
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name 'App.app' -type d -path '*Debug-iphonesimulator*' | head -1)
          echo "app: $APP"
          test -n "$APP"
          plutil -p "$APP/Info.plist" | grep -A2 UIApplicationShortcutItems
          plutil -p "$APP/Info.plist" | grep -q 'openchamber://new-session'
          plutil -p "$APP/Info.plist" | grep -q 'openchamber://sessions?filter=attention'
          echo 'both shortcuts are in the built bundle'
