name: selfbuild dmg

# Nobody maintains a list of PRs here. Every trigger asks GitHub which pull
# requests the author has open on upstream, then:
#
#   gate  (ubuntu, seconds)  derive that set, hash it, stop if a build for the
#                            same hash already exists
#   build (macOS, ~9 min)    merge the set onto upstream main and package a DMG
#
# A push to any branch (your PR branches included) re-derives the set, so a
# commit to an open PR rebuilds. A new PR that is opened without a new push is
# picked up by the cron. The app is unsigned: macOS quarantines anything
# downloaded, so run `xattr -cr /Applications/OpenChamber.app` once after
# installing. This file lives on `selfbuild`, which is the repository's default
# branch so that `schedule` and `workflow_dispatch` are available.

on:
  push:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      prs:
        description: 'Explicit PR numbers, comma separated (default: every open PR of the author)'
        required: false
        default: ''

concurrency:
  group: selfbuild-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  UPSTREAM: openchamber/openchamber
  AUTHOR: gaojunran

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      signature: ${{ steps.decide.outputs.signature }}
      prs: ${{ steps.decide.outputs.prs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide whether this set has been built
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PRS_INPUT: ${{ inputs.prs }}
        run: |
          set -euo pipefail
          explicit="$PRS_INPUT"
          if [ -n "$explicit" ]; then
            set_desc="$(echo "$explicit" | tr -d ' ')"
            set_pairs=""
          else
            set_desc="$(gh pr list --repo "$UPSTREAM" --author "$AUTHOR" --state open --limit 100 \
              --json number,headRefOid --jq 'sort_by(.number)|map("\(.number)")|join(",")')"
            set_pairs="$(gh pr list --repo "$UPSTREAM" --author "$AUTHOR" --state open --limit 100 \
              --json number,headRefOid --jq 'sort_by(.number)|map("\(.number):\(.headRefOid)")|join(",")')"
          fi
          skip="$({ grep -vE '^[[:space:]]*(#|$)' selfbuild/skip.txt 2>/dev/null || true; } | tr -d ' ' | sort -n | tr '\n' ',')"
          # An upstream version bump is worth a rebuild on its own: it is how a
          # new release reaches the daily build.
          upstream_version="$(gh api "repos/$UPSTREAM/contents/packages/electron/package.json?ref=main" --jq '.content' \
            | base64 -d | (jq -r '.version // empty' || true))"
          signature="$(printf '%s|%s|%s|%s' "$set_desc" "$set_pairs" "$skip" "$upstream_version" | sha256sum | cut -c1-12)"

          echo "set      ${set_desc:-<none>}"
          echo "skip     ${skip:-<none>}"
          echo "upstream ${upstream_version:-<unknown>}"
          echo "signature $signature"

          echo "prs=$set_desc" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"

          # A push to the tooling branch always builds: it validates the script.
          if [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/selfbuild" ]; then
            echo "tooling push, building"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$explicit" ] && [ -z "$set_desc" ]; then
            echo "no open PRs, nothing to build"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' \
            | grep -qx "selfbuild-${signature}"; then
            echo "artifact selfbuild-${signature} already exists, skipping"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the script merges upstream PR heads into a worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Point the build at upstream
        run: git remote add upstream "https://github.com/${UPSTREAM}.git"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Merge, type-check, package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELFBUILD_PRS: ${{ inputs.prs }}
        run: |
          extra=()
          if [ -n "$SELFBUILD_PRS" ]; then extra=(--prs "$SELFBUILD_PRS"); fi
          node selfbuild/oc-selfbuild.mjs --no-install --author "$AUTHOR" --out "$RUNNER_TEMP/out" "${extra[@]}"

      - name: Checksums
        if: always()
        run: |
          cd "$RUNNER_TEMP/out" 2>/dev/null || exit 0
          shasum -a 256 *.dmg 2>/dev/null | tee SHA256SUMS || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### selfbuild \`${{ needs.gate.outputs.signature }}\`"
            if [ -f "$RUNNER_TEMP/out/selfbuild-report.json" ]; then
              echo '```json'
              cat "$RUNNER_TEMP/out/selfbuild-report.json"
              echo '```'
            else
              echo 'No report: the merge or the packaging step failed, see the log above.'
            fi
            echo
            echo 'Install the downloaded artifact:'
            echo '```sh'
            echo 'hdiutil attach -nobrowse ~/Downloads/OpenChamber-*.dmg'
            echo 'ditto "/Volumes/OpenChamber/OpenChamber.app" /Applications/OpenChamber.app'
            echo 'xattr -cr /Applications/OpenChamber.app   # unsigned, and the browser quarantined it'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: selfbuild-${{ needs.gate.outputs.signature }}
          path: |
            ${{ runner.temp }}/out/*.dmg
            ${{ runner.temp }}/out/selfbuild-report.json
            ${{ runner.temp }}/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
