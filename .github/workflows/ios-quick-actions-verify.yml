name: iOS quick actions verify

# Temporary: compiles the app on a GitHub-hosted macOS runner to prove AppDelegate.swift
# and Info.plist are accepted. Not intended for the repository.

on:
  workflow_dispatch:

jobs:
  build:
    name: Build the app for the simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install

      - name: Build for the simulator
        run: bun run mobile:build:ios:simulator

      - name: Assert the quick actions reached the bundle
        run: |
          set -euo pipefail
          APP=$(find packages/mobile/ios -name 'App.app' -maxdepth 6 -type d | head -1)
          echo "app: $APP"
          test -n "$APP"
          plutil -p "$APP/Info.plist" | grep -A2 UIApplicationShortcutItems
          plutil -p "$APP/Info.plist" | grep -q 'openchamber://new-session'
          plutil -p "$APP/Info.plist" | grep -q 'openchamber://sessions?filter=attention'
          echo 'both shortcuts are in the built bundle'
